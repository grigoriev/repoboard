name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    # uv sync and uv run follow .python-version unless told otherwise. This keeps each leg on its version.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python ${{ matrix.python-version }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: uv sync --extra dev --group visual
      - name: Check the Python version of the leg
        run: uv run python -c 'import os, platform; v = platform.python_version(); assert v.startswith(os.environ["UV_PYTHON"] + "."), v; print(v)'

      - name: Type check with mypy
        run: uv run mypy repoboard tests

      - name: Run tests
        run: uv run pytest tests/ -v

  # Repoboard.app for Apple silicon. The app updates itself from this zip, see repoboard/update.py.
  app:
    runs-on: macos-latest
    needs: test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build Repoboard.app
        run: scripts/build-app.sh

      # ditto keeps the bundle structure and its signature intact, which zip does not.
      - name: Pack the app
        run: ditto -c -k --keepParent dist/Repoboard.app "dist/Repoboard-${GITHUB_REF_NAME#v}-macos-arm64.zip"

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: dist/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, app]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The notes come from the CHANGELOG.md section that bump-version.yml cut.
      # A tag without that section fails here, before anything is published.
      - name: Read the release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      # Releases are immutable: the release gets all its files in the one create
      # call below. A tag that has a release already stops here, before the build.
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only "not found" (HTTP 404) lets the release go on. Any other lookup
          # error stops it too, so an API failure never reads as "no release".
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1); then
            echo "::error::Release $GITHUB_REF_NAME exists. Releases are immutable: release a new version."
            exit 1
          fi
          case "$out" in
            *"(HTTP 404)"*) echo "No release $GITHUB_REF_NAME yet." ;;
            *) echo "::error::Cannot look up release $GITHUB_REF_NAME: $out"; exit 1 ;;
          esac

      - name: Build package
        run: uv build

      - name: Download the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: dist

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The signed provenance bundle travels with the files.
          cp "$BUNDLE" "dist/repoboard-${GITHUB_REF_NAME#v}.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/*.zip dist/*.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
