sonar.projectKey=grigoriev_repoboard
sonar.projectName=repoboard
sonar.organization=grigoriev

sonar.sources=repoboard
sonar.tests=tests

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# htmx.min.js is a vendored release of htmx, not our code.
sonar.exclusions=**/__pycache__/**,**/*.pyc,repoboard/web/static/htmx.min.js
# The static UI script has no JavaScript test runner; pytest covers the routes it calls.
sonar.coverage.exclusions=tests/**,repoboard/web/static/**

# Reduced motion must beat every transition, including the ones htmx injects. The universal
# rule needs !important for that, which css:S9423 flags.
sonar.issue.ignore.multicriteria=motion,pillowfont
sonar.issue.ignore.multicriteria.motion.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.motion.resourceKey=repoboard/web/static/app.css

# ImageFont.load_default(size=...) exists since Pillow 10.1. Sonar's stub is older and flags the
# keyword as unexpected (python:S930).
sonar.issue.ignore.multicriteria.pillowfont.ruleKey=python:S930
sonar.issue.ignore.multicriteria.pillowfont.resourceKey=repoboard/tray.py
