sonar.projectKey=grigoriev_repoboard
sonar.projectName=repoboard
sonar.organization=grigoriev

sonar.sources=repoboard
sonar.tests=tests

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# htmx.min.js is a vendored release of htmx, not our code.
sonar.exclusions=**/__pycache__/**,**/*.pyc,repoboard/web/static/htmx.min.js
# The static UI script has no JavaScript test runner; pytest covers the routes it calls.
sonar.coverage.exclusions=tests/**,repoboard/web/static/**
