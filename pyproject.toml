[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoboard"
version = "0.1.0"
description = "Daily overview of the GitHub repositories you work with, in the menu bar."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Sergey Grigoriev", email = "grigoriev@fastmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.146.0",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.4",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.4.0",
    "ruff==0.16.10",
    "httpx2>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/grigoriev/repoboard"
Repository = "https://github.com/grigoriev/repoboard"
Issues = "https://github.com/grigoriev/repoboard/issues"

[project.scripts]
repoboard = "repoboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["repoboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["repoboard"]

[tool.uv]
required-version = ">=0.5.0"

[tool.coverage.run]
source = ["repoboard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
show_error_codes = true
