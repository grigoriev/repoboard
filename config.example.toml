# Repoboard config. Default location: ~/.config/repoboard/config.toml.
# Override the location with the REPOBOARD_CONFIG environment variable.

# UI and notification language: en, ru or de.
language = "en"

# Minutes between two polls.
poll_interval_minutes = 10

# Closed issues updated within this many days are checked for new replies.
lookback_days = 14

# Port of the local web UI on 127.0.0.1.
port = 8765

# SQLite database with the snapshots and the seen marks.
database = "~/.local/state/repoboard/repoboard.sqlite3"

# Code scanning tools whose alerts Repoboard leaves out. Scorecard reports repository hygiene,
# not vulnerabilities. Set it to [] to see every alert.
hidden_alert_tools = ["Scorecard"]

# Single repositories to watch, as "owner/name".
repos = [
    "cli/cli",
]

# Single pull requests, issues and discussions to watch, by their links, in any repository.
items = [
    "https://github.com/cli/cli/pull/12345",
]

# Every repository of a user or organization. New repositories join on their own; Repoboard
# lists them again every hour. Patterns match the repository name, * and ? as wildcards.
# exclude_types takes archived, fork, mirror, template, private and public; the default leaves
# out archived repositories and forks.
[[owners]]
name = "grigoriev"

[[owners]]
name = "intechcore"
exclude = ["articles"]

[[owners]]
name = "SchweizerischeBundesbahnen"
include = ["ch.sbb.polarion.*", "*polarion*"]
exclude_types = ["archived", "fork", "private"]
